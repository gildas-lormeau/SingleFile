name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      -
        name: Checkout sources
        uses: actions/checkout@v5
      -
        name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      -
        name: Install dependencies
        run: npm ci
      -
        name: Run linter
        run: npx eslint .
      -
        name: Run the unit tests
        run: npm test
      -
        name: Build the extension packages
        run: ./build-extension.sh
      # the checked-in files in lib/ must be exactly what the sources produce
      -
        name: Check the committed build output
        run: git diff --exit-code
      # this file is inlined into every self-extracting page, which declares
      # windows-1252, so one non-ASCII character in it is re-decoded there and the
      # CP437 table it carries is shifted, which mangles the entry names read
      # through it (single-file-core doc/singlefile-archive.md, 2.1 and 5.8). terser
      # emits the shortest form unless told otherwise, so a rollup config that loses
      # ascii_only reintroduces this silently
      -
        name: Check the inlined zip build is pure ASCII
        run: |
          strays=$(LC_ALL=C tr -d '\11\12\15\40-\176' < lib/single-file-zip.min.js | wc -c)
          if [ "$strays" -ne 0 ]; then
            echo "lib/single-file-zip.min.js holds $strays bytes outside printable ASCII"
            exit 1
          fi
      # the repository and the packages built without WOLEET_API_KEY must stay keyless
      -
        name: Check the Woleet API key stays out of the repository
        run: |
          grep -q WOLEET_API_KEY_PLACEHOLDER src/lib/woleet/woleet.js
          grep -q WOLEET_API_KEY_PLACEHOLDER lib/single-file-extension-background.js
          if git grep -q "eyJhbGciOiJIUzI1NiJ9" -- ':!.github'; then
            echo "a committed file contains a JWT"
            exit 1
          fi
          unzip -p singlefile-extension-firefox.zip lib/single-file-extension-background.js | grep -q WOLEET_API_KEY_PLACEHOLDER

  # The functional suite of single-file-tests drives this extension in a real browser and checks the
  # files it saves, the way the release gate does on a packaged build. A group that fails makes the
  # workflow fail: a test failing now and then gets its cause found, it is not tolerated here.
  functional:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # the specs are split into groups of similar length, one machine each, to shorten the run
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      -
        name: Checkout sources
        uses: actions/checkout@v5
        with:
          path: single-file
      -
        name: Checkout the functional suite
        uses: actions/checkout@v5
        with:
          repository: gildas-lormeau/single-file-tests
          path: single-file-tests
      -
        name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
      # the suite looks for the extension in the sibling directory, and for the browser where these
      # variables say: a browser and a driver installed together are of the same version
      -
        name: Install the browser
        run: |
          firefox=$(npx --yes @puppeteer/browsers install firefox@stable --path "$RUNNER_TEMP/browsers" | tail -1 | cut -d' ' -f2-)
          echo "SF_FIREFOX_PATH=$firefox" >> "$GITHUB_ENV"
      -
        name: Run the functional suite
        working-directory: single-file-tests
        run: node extension/run.mjs --browser=firefox --shard=${{ matrix.shard }}/3
