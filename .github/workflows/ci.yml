name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      -
        name: Checkout sources
        uses: actions/checkout@v5
      -
        name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      -
        name: Install dependencies
        run: npm ci
      -
        name: Run linter
        run: npx eslint .
      -
        name: Build the extension packages
        run: ./build-extension.sh
      # the checked-in files in lib/ must be exactly what the sources produce
      -
        name: Check the committed build output
        run: git diff --exit-code
      # this file is inlined into every self-extracting page, which declares
      # windows-1252, so one non-ASCII character in it is re-decoded there and the
      # CP437 table it carries is shifted, which mangles the entry names read
      # through it (single-file-core doc/singlefile-archive.md, 2.1 and 5.8). terser
      # emits the shortest form unless told otherwise, so a rollup config that loses
      # ascii_only reintroduces this silently
      -
        name: Check the inlined zip build is pure ASCII
        run: |
          strays=$(LC_ALL=C tr -d '\11\12\15\40-\176' < lib/single-file-zip.min.js | wc -c)
          if [ "$strays" -ne 0 ]; then
            echo "lib/single-file-zip.min.js holds $strays bytes outside printable ASCII"
            exit 1
          fi
      # the repository and the packages built without WOLEET_API_KEY must stay keyless
      -
        name: Check the Woleet API key stays out of the repository
        run: |
          grep -q WOLEET_API_KEY_PLACEHOLDER src/lib/woleet/woleet.js
          grep -q WOLEET_API_KEY_PLACEHOLDER lib/single-file-extension-background.js
          if git grep -q "eyJhbGciOiJIUzI1NiJ9" -- ':!.github'; then
            echo "a committed file contains a JWT"
            exit 1
          fi
          unzip -p singlefile-extension-firefox.zip lib/single-file-extension-background.js | grep -q WOLEET_API_KEY_PLACEHOLDER
